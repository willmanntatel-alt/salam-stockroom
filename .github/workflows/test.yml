name: Salam tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned official compiler and verify its checksum
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/SalamLang/Salam/releases/download/v0.5.5
          asset=salam-0.5.5-linux-x86_64.tar.gz
          mkdir -p "$RUNNER_TEMP/salam"
          cd "$RUNNER_TEMP/salam"
          curl --fail --location --retry 3 -O "$base/$asset"
          curl --fail --location --retry 3 -O "$base/$asset.sha256"
          sha256sum --check "$asset.sha256"
          tar xzf "$asset"
          echo "SALAM=$RUNNER_TEMP/salam/salam-linux-x86_64/salam" >> "$GITHUB_ENV"
          echo "SALAM_STD=$RUNNER_TEMP/salam/salam-linux-x86_64/std" >> "$GITHUB_ENV"
      - name: Compile and test the real program
        run: python3 tests/run.py
